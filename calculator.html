<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaScript Калькулятор</title>
    <style>
        body {
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            color: #89b4fa;
            margin-bottom: 20px;
            font-size: 22px;
            text-align: center;
        }

        .calculator {
            background-color: #181825;
            border: 2px solid #89b4fa;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 300px;
        }

        #display {
            width: 100%;
            height: 60px;
            background-color: #11111b;
            border: 1px solid #313244;
            border-radius: 6px;
            color: #a6e3a1;
            font-size: 26px;
            text-align: right;
            padding: 0 15px;
            box-sizing: border-box;
            margin-bottom: 15px;
            line-height: 60px;
            overflow: hidden;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            background-color: #313244;
            color: #cdd6f4;
            border: none;
            border-radius: 6px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }

        button:hover {
            background-color: #45475a;
        }

        button:active {
            background-color: #585b70;
            transform: scale(0.95);
        }

        button.operator {
            background-color: #89b4fa;
            color: #11111b;
        }

        button.operator:hover {
            background-color: #b4befe;
        }

        button.clear {
            background-color: #f38ba8;
            color: #11111b;
        }

        button.clear:hover {
            background-color: #eba0ac;
        }
    </style>
</head>
<body>

    <h1>🧮 NovaScript Calculator</h1>
    
    <div class="calculator">
        <div id="display">0</div>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="appendValue('(')">(</button>
            <button onclick="appendValue(')')">)</button>
            <button class="operator" onclick="appendValue('/')">/</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">*</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">-</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>
            
            <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="operator" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let display = document.getElementById("display");
        let currentInput = "0";

        // Функция генерации звука щелчка
        function playClickSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(500, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.04);
                
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.04);
            } catch(e) {
                // Игнорируем ограничения браузера
            }
        }

        function appendValue(val) {
            playClickSound();
            if (currentInput === "0" && val !== ".") {
                currentInput = val;
            } else {
                currentInput += val;
            }
            display.textContent = currentInput;
        }

        function clearDisplay() {
            playClickSound();
            currentInput = "0";
            display.textContent = currentInput;
        }

        function calculate() {
            playClickSound();
            try {
                let result = eval(currentInput);
                currentInput = result.toString();
                display.textContent = currentInput;
            } catch (error) {
                display.textContent = "Ошибка";
                currentInput = "0";
            }
        }
    </script>

</body>
</html>
