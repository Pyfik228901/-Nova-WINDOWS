<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра Змейка</title>
    <style>
        body {
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            color: #89b4fa;
            margin-bottom: 10px;
        }

        .score-board {
            font-size: 20px;
            margin-bottom: 15px;
        }

        canvas {
            background-color: #11111b;
            border: 3px solid #89b4fa;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .controls-info {
            margin-top: 15px;
            color: #a6adc8;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>🐍 Игра Змейка</h1>
    <div class="score-board">Счёт: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls-info">Управление: Стрелочки на клавиатуре</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        // Размер одной ячейки сетки
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // Позиция змейки
        let snake = [
            { x: 10, y: 10 }
        ];

        // Позиция яблока
        let food = { x: 15, y: 15 };

        // Направление движения
        let dx = 0;
        let dy = 0;

        let score = 0;
        let gameInterval;

        // Отслеживание нажатий клавиш
        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const LEFT = 37;
            const UP = 38;
            const RIGHT = 39;
            const DOWN = 40;

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (keyPressed === LEFT && !goingRight) {
                dx = -1;
                dy = 0;
            }
            if (keyPressed === UP && !goingDown) {
                dx = 0;
                dy = -1;
            }
            if (keyPressed === RIGHT && !goingLeft) {
                dx = 1;
                dy = 0;
            }
            if (keyPressed === DOWN && !goingUp) {
                dx = 0;
                dy = 1;
            }
        }

        // Главный цикл игры
        function drawGame() {
            moveSnake();

            if (checkGameOver()) {
                alert("Игра окончена! Твой счёт: " + score);
                resetGame();
                return;
            }

            clearCanvas();
            checkFoodCollision();
            drawFood();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#11111b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            ctx.fillStyle = "#a6e3a1";
            snake.forEach((part, index) => {
                // Голова змейки чуть темнее
                if (index === 0) {
                    ctx.fillStyle = "#94e2d5";
                } else {
                    ctx.fillStyle = "#a6e3a1";
                }
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            // Создаем новую голову змейки
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            
            // Если змейка еще не начала движение, не передвигаем её
            if (dx === 0 && dy === 0) return;

            snake.unshift(head);
            snake.pop();
        }

        function drawFood() {
            ctx.fillStyle = "#f38ba8";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function checkFoodCollision() {
            if (snake[0].x === food.x && snake[0].y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                
                // Увеличиваем змейку (не удаляем хвост)
                snake.push({});

                // Спавним новое яблоко
                generateFood();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            // Проверяем, чтобы яблоко не появились внутри змейки
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                }
            });
        }

        function checkGameOver() {
            // Столкновение со стенами
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= tileCount;
            const hitToptWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= tileCount;

            if (hitLeftWall || hitRightWall || hitToptWall || hitBottomWall) {
                return true;
            }

            // Столкновение со своим хвостом
            for (let i = 1; i < snake.length; i++) {
                if (snake[0].x === snake[i].x && snake[0].y === snake[i].y) {
                    return true;
                }
            }

            return false;
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            food = { x: 15, y: 15 };
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
        }

        // Запуск игры с обновлением каждые 100 мс (10 кадров в секунду)
        setInterval(drawGame, 100);
    </script>

</body>
</html>
