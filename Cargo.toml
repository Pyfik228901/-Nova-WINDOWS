[package]
name = "ns"
version = "1.0.0"
edition = "2021"
description = "N&S (Nova Script) - fast, lightweight and modern programming language"
authors = ["m1oky"]
license = "MIT"

[lib]
name = "ns"
path = "src/lib.rs"

[[bin]]
name = "ns"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rustyline = "14.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
rand = "0.8"
indexmap = { version = "2.2", features = ["serde"] }

[build-dependencies]
winres = "0.1"
