<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111B"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89B4FA" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#CBA6F7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A6E3A1" stop-opacity="0.8"/>
    </linearGradient>

    <!-- N Accent Gradient -->
    <linearGradient id="n-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89B4FA"/>
      <stop offset="100%" stop-color="#74C7EC"/>
    </linearGradient>

    <!-- Ampersand Accent Gradient -->
    <linearGradient id="amp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C2E7"/>
      <stop offset="100%" stop-color="#CBA6F7"/>
    </linearGradient>

    <!-- S Accent Gradient -->
    <linearGradient id="s-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A6E3A1"/>
      <stop offset="100%" stop-color="#94E2D5"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Badge -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="6"/>

  <!-- Subtle Inner Grid / Tech Elements -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#313244" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#313244" stroke-width="1.5" opacity="0.2"/>

  <!-- Monogram Group -->
  <g filter="url(#glow)">
    <!-- Letter 'N' -->
    <path d="M 108 340 L 108 172 L 142 172 L 208 284 L 208 172 L 238 172 L 238 340 L 204 340 L 138 226 L 138 340 Z" 
          fill="url(#n-grad)"/>

    <!-- Ampersand '&' Central Feature -->
    <path d="M 276 270 C 265 258 258 248 258 234 C 258 214 272 200 292 200 C 310 200 324 212 324 230 C 324 246 312 258 296 268 L 334 322 L 302 322 L 274 282 C 268 287 260 292 250 296 C 238 300 224 300 216 292 C 206 282 208 266 220 256 C 228 248 242 244 258 242 C 258 238 258 232 264 226 C 268 222 276 218 284 220 C 290 222 294 226 294 232 C 294 240 288 246 276 254 Z M 256 262 C 244 264 236 270 236 278 C 236 284 242 288 248 288 C 258 288 268 280 274 272 Z"
          fill="url(#amp-grad)"/>

    <!-- Letter 'S' -->
    <path d="M 398 172 C 374 172 354 186 354 212 C 354 248 402 246 402 274 C 402 288 388 294 374 294 C 356 294 346 284 342 272 L 314 278 C 322 308 346 322 374 322 C 406 322 432 304 432 274 C 432 234 384 238 384 214 C 384 204 394 198 404 198 C 418 198 428 206 432 218 L 458 210 C 452 186 430 172 398 172 Z" 
          fill="url(#s-grad)"/>
  </g>

  <!-- Modern Dynamic Dot Elements -->
  <circle cx="108" cy="154" r="6" fill="#89B4FA"/>
  <circle cx="432" cy="340" r="6" fill="#A6E3A1"/>
  <circle cx="292" cy="184" r="4" fill="#CBA6F7"/>
</svg>
